[package]
name = "newsnow"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rust-embed = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "json", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.23"
quick-xml = "0.37"
chrono = "0.4"
chrono-tz = "0.10"
md-5 = "0.10"
sha1 = "0.10"
base64 = "0.22"
regex = "1"
urlencoding = "2"
encoding_rs = "0.8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
