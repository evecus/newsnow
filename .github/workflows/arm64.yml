name: build linux arm64

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-arm64-musl:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 前端：Node + pnpm，构建 frontend/ -> frontend/dist（rust-embed 直接嵌入二进制）──
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm exec vite build

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-musl-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-musl-arm64-

      # ── 原生编译：ARM64 宿主机 + musl 目标，仅需 musl-gcc 作为链接器 ────
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # 必须在前端构建之后：编译时 frontend/dist 被嵌入二进制
      - name: Build (aarch64-unknown-linux-musl, release)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: Collect artifact
        run: |
          cp target/aarch64-unknown-linux-musl/release/newsnow newsnow-linux-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          prerelease: true
          files: newsnow-linux-arm64
